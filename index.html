<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Щоденний трекер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ГОЛОВНИЙ ЕКРАН ТРЕКЕРА -->
  <div id="main-screen" class="app-container">
    <div class="header">
      <h2 id="welcome-msg">Тижневий трекер</h2>
      <div>
        <button class="btn-icon" onclick="openEditModal()" title="Редагувати завдання">✏️</button>
      </div>
    </div>
    
    <!-- Контейнер куди динамічно завантажується таблиця -->
    <div class="table-container" id="table-container">
      <div class="loading">Завантаження завдань...</div>
    </div>
  </div>

  <!-- МОДАЛКА РЕДАГУВАННЯ / ДОДАВАННЯ -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <div class="header" style="margin-bottom: 12px;">
        <h2 style="font-size: 15px;">Редагування завдань</h2>
        <button class="btn-icon" onclick="openEditModal()">✕</button>
      </div>
      
      <!-- Поле додавання нового завдання -->
      <div class="add-task-box">
        <input type="text" id="new-task-input" placeholder="Нове завдання..." />
        <button class="submit-btn" id="btn-add-task" onclick="addNewTask()">Додати</button>
      </div>
      
      <hr style="margin: 12px 0; border: none; border-top: 1px solid #333;" />
      
      <!-- Список для редагування існуючих завдань -->
      <div id="edit-list-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
